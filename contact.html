<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="container py-4">

      <div class="card p-3 mb-4">
        <h2><i class="fa-solid fa-address-book"></i> College Address</h2>
        <p>
          Jigme Namgyel Engineering College<br>
          Dewathang, Samdrup Jongkhar<br>
          Bhutan
        </p>

        <h2><i class="fa-solid fa-envelope"></i> Email</h2>
        <p>
          <a href="mailto:info@jnec.edu.bt">info@jnec.edu.bt</a>
        </p>

        <h2><i class="fa-solid fa-phone"></i> Phone</h2>
        <p>+975 18935643</p>
      </div>

      <h2>Location</h2>
      <div class="card p-2 mb-4">
        <iframe
          src="https://www.google.com/maps?q=Jigme%20Namgyel%20Engineering%20College&output=embed"
          width="100%"
          height="300"
          style="border:0;"
          class="rounded"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>

      <div class="card p-3">
        <h2>Enquiry Form</h2>
        <form action="#" method="post" id="enquiryForm">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
